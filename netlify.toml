[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18.19.0"

[[redirects]]
  from = "/admin"
  to = "/pages/admin/kioskeys-admin-x7k9y2"
  status = 200

# Serve extensionless URLs under /pages/ as their .html counterparts
[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat.html"
  status = 200